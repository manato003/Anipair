<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4e5d2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Anipair" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="description" content="あなたの「好き」と、次の「好き」をつなぐ。Annict の視聴記録を、タップだけで付けていくためのアプリ。見たアニメを1タップで評価して、好みに合う作品も提案します。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 書体の CSS は先読みだけにして、最初の描画を止めない（別のサーバーへの接続を待たない）。
         本当に当てるのは src/main.tsx（この preload を stylesheet に変える）。CSP で HTML の中の onload は使えないため -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" />
    <!-- ロゴの「Anipair」の字だけ（text= でその文字だけの小さなフォントを読む） -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap&text=Anipair" />
    <!-- 最初の読み込み中の表示（下の .splash）の見た目 -->
    <link rel="stylesheet" href="/splash.css" />
    <title>Anipair</title>
  </head>
  <body>
    <div id="root">
      <!-- アプリの JS を読み終えるまでの読み込み中の表示（React が描き始めると置き換わる）。アンテナの揺れるアニ（scripts/make_brand.tsx が書き出す。色は public/splash.css） -->
      <div class="splash" role="status">
        <svg class="splash__mark mascot" viewBox="0 0 120 120" aria-hidden="true"><g class="m-ani"><g class="m-antenna m-antenna--wiggle"><path class="m-wire" d="M52 40Q46 24 39 13" stroke-width="4.2"></path><path class="m-wire" d="M68 40Q74 24 81 13" stroke-width="4.2"></path><circle class="m-accent m-tip" cx="38" cy="11" r="5.4" stroke-width="3.2"></circle><circle class="m-accent m-tip" cx="82" cy="11" r="5.4" stroke-width="3.2"></circle></g><ellipse class="m-body" cx="44" cy="108" rx="9" ry="5.5" stroke-width="3.7800000000000002"></ellipse><ellipse class="m-body" cx="76" cy="108" rx="9" ry="5.5" stroke-width="3.7800000000000002"></ellipse><path class="m-wire" d="M18 80q-6 6-4 13" stroke-width="4.2"></path><path class="m-wire" d="M102 80q6 6 4 13" stroke-width="4.2"></path><path class="m-body" d="M16 76C16 50 35 37 60 37s44 13 44 39c0 21-17 32-44 32S16 97 16 76Z" stroke-width="4.2"></path><path class="m-belly" d="M30 94c8 7 18 9 30 9s22-2 30-9" stroke-width="7"></path><ellipse class="m-ink" cx="49" cy="68.5" rx="3.6" ry="5"></ellipse><circle class="m-hi" cx="50.2" cy="66.7" r="1.25"></circle><ellipse class="m-ink" cx="73" cy="68.5" rx="3.6" ry="5"></ellipse><circle class="m-hi" cx="74.2" cy="66.7" r="1.25"></circle><path class="m-line" d="M57.5 80h5" stroke-width="3"></path></g></svg>
        <span>読み込み中</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
